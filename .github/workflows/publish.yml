name: Publish Package to npm

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read versions
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "previous=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.version != needs.check.outputs.previous
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC trusted publishing + provenance
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      # No NODE_AUTH_TOKEN needed - uses OIDC trusted publisher configured on npmjs.com
      - name: Publish package
        run: npm publish --access public --provenance

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          PREVIOUS: ${{ needs.check.outputs.previous }}
        run: |
          git log ${PREVIOUS:+"$PREVIOUS..HEAD"} --pretty=format:'- %h %s' > "$RUNNER_TEMP/notes.md"
          gh release create "$VERSION" --title "$VERSION" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/notes.md"
